	<script>
		// Development only: browser extensions (e.g. MetaMask) inject scripts into every page, and their
		// errors pop up the dev server's full-screen error overlay as if the app had crashed. Window
		// listeners run in registration order, so this must be registered before the app bundle (which
		// brings the overlay); errors whose stack points into extension code stop here, the app's own
		// errors still show. In production builds the condition is false and nothing is registered.
		if ('%NODE_ENV%' === 'development') {
			(function () {
				var fromExtension = /(chrome|moz|safari(-web)?)-extension:\/\//;
				function ignoreExtensionErrors(event) {
					var where = [event.filename, event.error && event.error.stack, event.reason && event.reason.stack].join(' ');
					if (fromExtension.test(where)) event.stopImmediatePropagation();
				}
				window.addEventListener('error', ignoreExtensionErrors);
				window.addEventListener('unhandledrejection', ignoreExtensionErrors);
			})();
		}
	</script>
